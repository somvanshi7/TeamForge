# Render.com Blueprint — Infrastructure as Code
# Database: Neon PostgreSQL (external, free tier — no expiration)

services:
  - type: web
    name: teamforge
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        value: ep-icy-cell-bc5amv1x-pooler.c-16.us-east-1.aws.neon.tech
      - key: DB_NAME
        value: teamforge
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false  # Set in Render dashboard — do not commit secrets
      - key: DB_PORT
        value: "5432"
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m"
